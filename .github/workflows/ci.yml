name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q agent ingestion ui

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: SonarQube Cloud scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=agent,ingestion,ui,frontend/src
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**/*.py
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**
            -Dsonar.qualitygate.wait=true

  publish-images:
    name: Build and publish Docker images
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub secrets without printing values
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::error::DOCKERHUB_USERNAME is missing or empty in this workflow run"
            exit 1
          fi
          if [[ "$DOCKERHUB_USERNAME" != "vishesh11" ]]; then
            echo "::error::DOCKERHUB_USERNAME is set, but it does not match the expected Docker Hub ID vishesh11"
            exit 1
          fi
          echo "DOCKERHUB_USERNAME is available and matches vishesh11"
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::DOCKERHUB_TOKEN is missing or empty in this workflow run"
            exit 1
          fi
          echo "DOCKERHUB_TOKEN is available (value hidden)"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ragagent-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ragagent-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ragagent-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ragagent-frontend:latest
