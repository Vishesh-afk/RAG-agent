name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q agent ingestion ui

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: SonarQube Cloud scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=agent,ingestion,ui,frontend/src
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**/*.py
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**
            -Dsonar.qualitygate.wait=true

  publish-images:
    name: Build and publish Docker images
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check publishing secrets without printing values
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITLAB_GITOPS_TOKEN: ${{ secrets.GITLAB_GITOPS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::error::DOCKERHUB_USERNAME is missing or empty in this workflow run"
            exit 1
          fi
          if [[ "$DOCKERHUB_USERNAME" != "vishesh11" ]]; then
            echo "::error::DOCKERHUB_USERNAME is set, but it does not match the expected Docker Hub ID vishesh11"
            exit 1
          fi
          echo "DOCKERHUB_USERNAME is available and matches vishesh11"
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::DOCKERHUB_TOKEN is missing or empty in this workflow run"
            exit 1
          fi
          echo "DOCKERHUB_TOKEN is available (value hidden)"
          if [[ -z "$GITLAB_GITOPS_TOKEN" ]]; then
            echo "::error::GITLAB_GITOPS_TOKEN is missing; add it before publishing so the GitOps image tags can be updated"
            exit 1
          fi
          echo "GITLAB_GITOPS_TOKEN is available (value hidden)"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ragagent-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ragagent-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ragagent-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ragagent-frontend:latest

  promote-gitops:
    name: Update GitLab GitOps image tags
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-dev-promotion
      cancel-in-progress: false
    steps:
      - name: Commit the published image tags directly to GitOps main
        env:
          GITLAB_GITOPS_TOKEN: ${{ secrets.GITLAB_GITOPS_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import re

          token = os.environ["GITLAB_GITOPS_TOKEN"]
          project = urllib.parse.quote("visheshchourasia143/rag-agent-gitops", safe="")
          api = f"https://gitlab.com/api/v4/projects/{project}"
          branch = "main"
          tag = os.environ["IMAGE_TAG"]
          targets = {
              "apps/rag-agent/base/api-deployment.yaml": b"vishesh11/ragagent-backend",
              "apps/rag-agent/base/frontend-deployment.yaml": b"vishesh11/ragagent-frontend",
          }

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "PRIVATE-TOKEN": token,
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          def require_status(status, expected, operation):
              if status != expected:
                  raise SystemExit(f"GitLab {operation} failed with HTTP {status}; check token scope and Developer access to the GitOps project")

          def read_file(path, ref):
              encoded_path = urllib.parse.quote(path, safe="")
              url = f"{api}/repository/files/{encoded_path}?{urllib.parse.urlencode({'ref': ref})}"
              status, body = request(url)
              require_status(status, 200, f"read of {path}")
              return base64.b64decode(json.loads(body)["content"])

          def image_pattern(image):
              return re.compile(rb"(?m)^([ \t]*image:[ \t]*" + re.escape(image) + rb":)([^\s#]+)")

          main_images = {}
          for path, image in targets.items():
              original = read_file(path, branch)
              matches = image_pattern(image).findall(original)
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one image reference for {image.decode()} in {path}; found {len(matches)}")
              main_images[path] = matches[0][1].decode()

          if all(current_tag == tag for current_tag in main_images.values()):
              print(f"GitOps main already references both images at {tag}")
              raise SystemExit(0)

          actions = []
          for path, image in targets.items():
              original = read_file(path, branch)
              pattern = image_pattern(image)
              updated, count = pattern.subn(lambda match: match.group(1) + tag.encode(), original)
              if count != 1:
                  raise SystemExit(f"Expected exactly one image reference for {image.decode()} in {path}; found {count}")
              if updated != original:
                  actions.append({"action": "update", "file_path": path, "content": updated.decode("utf-8")})

          if not actions:
              print(f"GitOps main already references both images at {tag}")
              raise SystemExit(0)

          status, body = request(
              f"{api}/repository/commits",
              method="POST",
              payload={
                  "branch": branch,
                  "commit_message": f"Promote RAG Agent images to {tag[:12]}",
                  "actions": actions,
              },
          )
          if status == 403:
              raise SystemExit("GitLab rejected the direct commit (HTTP 403). Allow the GitOps token's bot account to push to protected main, then rerun this job.")
          require_status(status, 201, "direct GitOps commit to main")
          print(f"Updated both GitOps image tags on main to {tag}")
          PY
